name: TrustNotary CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lume Build & Deterministic Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install vendored Lume compiler
        run: npm install --no-audit --no-fund

      - name: Compile .lume modules & run deterministic test suite
        run: npm test
